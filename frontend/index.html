<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Notes App</h1>
    <p class="subtitle">Aplikasi catatan sederhana fullstack</p>

    <form id="noteForm" class="note-form">
      <input type="hidden" id="noteId" />

      <label for="judul">Judul</label>
      <input type="text" id="judul" placeholder="Masukkan judul catatan" required />

      <label for="isi">Isi Catatan</label>
      <textarea id="isi" placeholder="Masukkan isi catatan" required></textarea>

      <div class="button-group">
        <button type="submit" id="saveButton">Simpan</button>
        <button type="button" id="cancelButton" class="secondary">Batal Edit</button>
      </div>
    </form>

    <div class="list-header">
      <h2>Daftar Catatan</h2>
      <button id="refreshButton" class="secondary small">Refresh</button>
    </div>

    <div id="messageBox"></div>
    <div id="notesList" class="notes-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
